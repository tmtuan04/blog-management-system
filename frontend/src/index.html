<!doctype html>
<!--
  lang và <title> được LanguageService / TitleStrategy đặt lại khi chạy (docs/phase-4-frontend.md mục 3.4, 3.6).
  data-bs-theme="light" là giá trị tạm; script chặn bên dưới đặt lại trước khi CSS tải xong.
-->
<html lang="vi" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Inkwell</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      C1 (UC10): script chặn đặt data-bs-theme theo localStorage "theme" / prefers-color-scheme,
      chép từ html/js/theme.js. Đặt ngay tại đây, trước CSS, không defer/async.
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,700;1,400&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
