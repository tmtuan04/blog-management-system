<!doctype html>
<!--
  Khung mẫu trang quản trị (docs/phase-2-html.md mục 4.3).
  Cách dùng: copy file này vào admin/, đổi <title>, đổi mục .is-active + aria-current trong sidebar,
  rồi viết nội dung trong <main class="admin-content">. Màn mẫu đầy đủ: admin/posts.html.
  Sửa sidebar hoặc topbar thì sửa ở mọi file trong admin/ trong cùng một PR.
-->
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tên trang · Inkwell</title>

  <!-- Gán theme trước khi tải CSS để không bị nháy màu. Không thêm defer/async. -->
  <script src="../js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body data-demo-states="normal" data-demo-auths="blog_owner super_admin">
  <div class="admin-layout">

    <!-- component: admin-sidebar -->
    <aside class="admin-sidebar offcanvas-lg offcanvas-start" id="adminSidebar" tabindex="-1" aria-labelledby="adminSidebarLabel">
      <div class="offcanvas-header admin-sidebar__brand">
        <a class="brand" href="../public/index.html" id="adminSidebarLabel" data-i18n="common.site_name">Inkwell</a>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="offcanvas" data-bs-target="#adminSidebar" aria-label="Đóng menu" data-i18n-aria-label="common.close_menu"></button>
      </div>
      <div class="offcanvas-body">
        <div class="admin-sidebar__brand d-none d-lg-flex">
          <a class="brand" href="../public/index.html" data-i18n="common.site_name">Inkwell</a>
        </div>
        <nav aria-label="Menu quản trị" data-i18n-aria-label="admin.nav.label">
          <ul class="admin-sidebar__nav">
            <li>
              <a class="admin-sidebar__link" href="../admin/posts.html">
                <i class="bi bi-file-earmark-text" aria-hidden="true"></i>
                <span data-i18n="admin.nav.posts">Bài viết</span>
              </a>
            </li>
            <li data-demo-auth="super_admin">
              <a class="admin-sidebar__link" href="../admin/users.html">
                <i class="bi bi-people" aria-hidden="true"></i>
                <span data-i18n="admin.nav.users">Người dùng</span>
              </a>
            </li>
            <li data-demo-auth="super_admin">
              <a class="admin-sidebar__link" href="../admin/categories.html">
                <i class="bi bi-folder2" aria-hidden="true"></i>
                <span data-i18n="admin.nav.categories">Danh mục</span>
              </a>
            </li>
            <li data-demo-auth="super_admin">
              <a class="admin-sidebar__link" href="../admin/languages.html">
                <i class="bi bi-globe2" aria-hidden="true"></i>
                <span data-i18n="admin.nav.languages">Ngôn ngữ</span>
              </a>
            </li>
            <li data-demo-auth="super_admin">
              <a class="admin-sidebar__link" href="../admin/ui-translations.html">
                <i class="bi bi-translate" aria-hidden="true"></i>
                <span data-i18n="admin.nav.ui_translations">Bản dịch giao diện</span>
              </a>
            </li>
            <li data-demo-auth="super_admin">
              <a class="admin-sidebar__link" href="../admin/pages.html">
                <i class="bi bi-journal-richtext" aria-hidden="true"></i>
                <span data-i18n="admin.nav.pages">Trang tĩnh</span>
              </a>
            </li>
          </ul>
        </nav>
        <div class="admin-sidebar__footer">
          <a class="admin-sidebar__link" href="../public/index.html">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            <span data-i18n="admin.nav.back_to_blog">Về trang blog</span>
          </a>
        </div>
      </div>
    </aside>
    <!-- /component: admin-sidebar -->

    <div class="admin-main">

      <!-- component: admin-topbar -->
      <header class="admin-topbar">
        <button type="button" class="icon-btn d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#adminSidebar" aria-controls="adminSidebar" aria-label="Mở menu" data-i18n-aria-label="common.open_menu">
          <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <a class="brand d-lg-none ms-1" href="../public/index.html" data-i18n="common.site_name">Inkwell</a>

        <div class="d-flex align-items-center gap-1 ms-auto">

          <!-- component: language-switcher -->
          <div class="dropdown">
            <button type="button" class="icon-btn icon-btn--text" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Ngôn ngữ" data-i18n-aria-label="common.language">
              VI <i class="bi bi-chevron-down small" aria-hidden="true"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item active" href="#" aria-current="true">Tiếng Việt <i class="bi bi-check2 ms-auto" aria-hidden="true"></i></a></li>
              <li><a class="dropdown-item" href="#">English</a></li>
            </ul>
          </div>
          <!-- /component: language-switcher -->

          <!-- component: theme-toggle -->
          <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Giao diện tối" data-i18n-aria-label="common.dark_mode">
            <i class="bi bi-moon theme-toggle__icon--moon" aria-hidden="true"></i>
            <i class="bi bi-sun theme-toggle__icon--sun" aria-hidden="true"></i>
          </button>
          <!-- /component: theme-toggle -->

          <!-- component: user-menu -->
          <div class="dropdown ms-1">
            <button type="button" class="icon-btn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Tài khoản" data-i18n-aria-label="menu.account">
              <img class="avatar" src="../assets/img/avatars/2.svg" alt="" data-demo-auth="blog_owner">
              <span class="avatar avatar--initials" aria-hidden="true" data-demo-auth="super_admin">SA</span>
            </button>
            <div class="dropdown-menu dropdown-menu-end">
              <div class="px-3 py-2" data-demo-auth="blog_owner">
                <div class="fw-semibold">Nguyễn Văn An</div>
                <div class="text-meta">owner1@blog.local</div>
              </div>
              <div class="px-3 py-2" data-demo-auth="super_admin">
                <div class="fw-semibold">Super Admin</div>
                <div class="text-meta">admin@blog.local</div>
              </div>
              <hr class="dropdown-divider">
              <a class="dropdown-item" href="../public/profile.html">
                <i class="bi bi-person" aria-hidden="true"></i>
                <span data-i18n="menu.profile">Hồ sơ</span>
              </a>
              <a class="dropdown-item" href="../public/index.html">
                <i class="bi bi-house" aria-hidden="true"></i>
                <span data-i18n="admin.nav.back_to_blog">Về trang blog</span>
              </a>
              <hr class="dropdown-divider">
              <a class="dropdown-item" href="../public/login.html">
                <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                <span data-i18n="menu.logout">Đăng xuất</span>
              </a>
            </div>
          </div>
          <!-- /component: user-menu -->

        </div>
      </header>
      <!-- /component: admin-topbar -->

      <main class="admin-content">
        <div class="admin-page-header">
          <h1 class="text-page-title mb-0" data-i18n="admin.example.title">Tiêu đề trang</h1>
        </div>

        <!-- Nội dung trang -->
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/demo-state.js"></script>
</body>
</html>
