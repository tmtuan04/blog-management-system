<!doctype html>
<!--
  Khung mẫu trang tài khoản: đăng nhập, đăng ký, quên/đặt lại mật khẩu (docs/phase-2-html.md mục 4.2).
  Cách dùng: copy file này vào public/, đổi <title> và nội dung trong <div class="auth-card">.
  Phần trong thẻ đang là form đăng nhập làm mẫu:
  - Trang không có đăng nhập Google/Github (quên, đặt lại mật khẩu) thì xóa .auth-card__oauth và .auth-divider.
  - .auth-card__legal (điều khoản) chỉ dùng ở trang đăng ký.
  - Thông báo chung của form (sai mật khẩu, đăng ký thành công...) dùng .alert-inline, đặt ngay trên form.
  Trạng thái demo: normal, error (lỗi validate + thông báo), loading (nút đang gửi). Trang cần thêm trạng thái
  (tài khoản bị khóa, 429...) thì khai báo thêm trong data-demo-states, xem comment đầu js/demo-state.js.
-->
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt lại mật khẩu · Inkwell</title>

  <!-- Gán theme trước khi tải CSS để không bị nháy màu. Không thêm defer/async. -->
  <script src="../js/theme.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body data-demo-states="normal error loading">
  <div class="auth-layout">
    <header class="auth-layout__header">
      <a class="brand" href="#">Inkwell</a>
      <div class="d-flex align-items-center gap-1">
        <button type="button" class="icon-btn icon-btn--text" aria-label="Ngôn ngữ">VI <svg
            xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
            data-lucide="chevron-down" class="lucide lucide-chevron-down bi bi-chevron-down small" aria-hidden="true">
            <path d="m6 9 6 6 6-6"></path>
          </svg></button>
        <button type="button" class="icon-btn theme-toggle" aria-label="Giao diện tối">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" data-lucide="moon"
            class="lucide lucide-moon bi bi-moon theme-toggle__icon--moon" aria-hidden="true">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" data-lucide="sun"
            class="lucide lucide-sun bi bi-sun theme-toggle__icon--sun" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        </button>
      </div>
    </header>
    <main class="auth-layout__main">
      <!-- component: auth-card -->
      <div class="auth-card">
        <h1 class="auth-card__title">Đặt mật khẩu mới</h1>
        <div data-state-show="expired" hidden="">
  
          <div class="alert-inline mb-3" role="alert" data-state-show="expired" hidden="">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
              data-lucide="circle-alert" class="lucide lucide-circle-alert bi bi-exclamation-circle" aria-hidden="true">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" x2="12" y1="8" y2="12"></line>
              <line x1="12" x2="12.01" y1="16" y2="16"></line>
            </svg>
            <div>Link đặt lại mật khẩu đã hết hạn hoặc không hợp lệ. Gửi lại yêu cầu để nhận link mới.</div>
          </div>
          <a class="btn btn-primary w-100 mt-2" href="#">Gửi lại link</a>
          <p class="auth-card__switch"><a href="#">Quay lại đăng nhập</a></p>
        </div>
        <form novalidate="" data-state-hide="expired">
  
          <div class="mb-3">
            <label class="form-label" for="rpPass">Mật khẩu mới</label>
            <input type="password" class="form-control" id="rpPass" value="matkhau1" data-invalid-on="error"
              autocomplete="new-password"  data-demo-invalid="error">
            <div class="invalid-feedback" data-demo="error">Mật khẩu cần ít nhất 8 ký tự, có cả chữ và số.</div>
            <div class="form-text" data-state-hide="error" data-demo="normal">Ít nhất 8 ký tự, có cả chữ và số.</div>
          </div>
  
          <div class="mb-3">
            <label class="form-label" for="rpPass2">Xác nhận mật khẩu mới</label>
            <input type="password" class="form-control" id="rpPass2" value="matkhau1" data-invalid-on="error"
              autocomplete="new-password" data-demo-invalid="error">
            <div class="invalid-feedback" data-demo="error">Mật khẩu xác nhận không khớp.</div>
  
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-2" data-demo-loading data-loading-text="Đang lưu mật khẩu...">
            Lưu mật khẩu
          </button>
        </form>
      </div>
      <!-- /component: auth-card -->
    </main>
    <footer class="auth-layout__footer">
      <a href="#">Giới thiệu</a><a href="#">Liên hệ</a><a href="#">Chính sách bảo mật</a>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/demo-state.js"></script>
</body>
</html>
